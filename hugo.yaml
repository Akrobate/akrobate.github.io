baseURL: https://example.org/
locale: fr-fr
title: Blog de Artiom FEDOROV
theme:
  - github.com/adityatelange/hugo-PaperMod
about: Bienvenue sur mon site !
defaultContentLanguage: 'fr'
markup:
  goldmark:
    renderer:
      unsafe: true
    parser:
      attribute:
        block: true
      wrapStandAloneImageWithinParagraph: false
  highlight:
#    style: "dracula" # Remplacez par le nom du style de votre choix
#    noClasses: false

params:
  comments: true
  cover:
    hiddenInSingle: true
  giscus:
    repo: "Akrobate/akrobate.github.io"
    repoId: "R_kgDOUpvtQQ"
    category: "Comments"
    categoryId: "DIC_kwDOUpvtQc4DLMeK"
    mapping: "pathname"
    strict: "0"
    reactionsEnabled: "1"
    emitMetadata: "0"
    inputPosition: "bottom"
    themeDark: "noborder_gray"
    themeLight: "light"
    lang: "fr"

menu:
  main:
    - name: Tags
      url: /tags/
      weight: 10
    - name: "Catégories"
      url: "/categories/"
      weight: 20
      