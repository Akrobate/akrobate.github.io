<div class="pinned-article-list">

{{- range site.Data.pinned -}}
    {{- $slug := .article -}}
    {{- range where site.RegularPages "Slug" $slug -}}
<div class="pinned-article has-thumb">
    <div class="entry-thumb">
        <figure class="entry-cover">
            {{- $page := . -}}
            {{- with $page.Params.cover.image -}}
                {{- $rel := strings.TrimPrefix "/" . -}}
                {{- $res := or
                    ($page.Resources.Get (path.Base .))
                    (resources.Get $rel)
                    (resources.Get .)
                -}}
                {{- with $res -}}
                    {{- $img := .Fill "70x70 Center" -}}
                    <img loading="lazy" src="{{ $img.RelPermalink }}" alt="{{ $page.Params.cover.alt | default "Image d'illustration" }}" />
                {{- else -}}
                    <img loading="lazy" src="{{ . | absURL }}" alt="{{ $page.Params.cover.alt | default "Image d'illustration" }}" />
                {{- end -}}
            {{- end -}}
        </figure>
    </div>
    <div class="entry-wrapper">
        <div class="entry-content">
        <p>{{ .Title }}</p>
        </div>
    </div>
    <a class="entry-link" aria-label="post link to {{ .Title | plainify }}" href="{{ .Permalink }}"></a>
</div>
    {{- end -}}
{{- end -}}
</div>
