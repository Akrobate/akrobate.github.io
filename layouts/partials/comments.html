<script>
(function () {
    const getTheme = () => {
        const theme = document.documentElement.getAttribute("data-theme");

        if (theme === "dark") return "{{ site.Params.giscus.themeDark }}";
        if (theme === "light") return "{{ site.Params.giscus.themeLight }}";

        return window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "{{ site.Params.giscus.themeDark }}"
            : "{{ site.Params.giscus.themeLight }}";
    };

    const giscusScript = document.createElement("script");

    giscusScript.src = "https://giscus.app/client.js";
    giscusScript.async = true;
    giscusScript.crossOrigin = "anonymous";

    giscusScript.setAttribute("data-repo", "{{ site.Params.giscus.repo }}");
    giscusScript.setAttribute("data-repo-id", "{{ site.Params.giscus.repoId }}");
    giscusScript.setAttribute("data-category", "{{ site.Params.giscus.category }}");
    giscusScript.setAttribute("data-category-id", "{{ site.Params.giscus.categoryId }}");
    giscusScript.setAttribute("data-mapping", "{{ site.Params.giscus.mapping }}");
    giscusScript.setAttribute("data-strict", "{{ site.Params.giscus.strict }}");
    giscusScript.setAttribute("data-reactions-enabled", "{{ site.Params.giscus.reactionsEnabled }}");
    giscusScript.setAttribute("data-emit-metadata", "{{ site.Params.giscus.emitMetadata }}");
    giscusScript.setAttribute("data-input-position", "{{ site.Params.giscus.inputPosition }}");
    giscusScript.setAttribute("data-theme", getTheme());
    giscusScript.setAttribute("data-lang", "{{ site.Params.giscus.lang }}");

    function updateGiscusTheme() {
        const iframe = document.querySelector(".giscus-frame");

        if (!iframe) return;

        iframe.contentWindow.postMessage(
            {
                giscus: {
                    setConfig: {
                        theme: getTheme()
                    }
                }
            },
            "https://giscus.app"
        );
    }

    const observer = new MutationObserver(() => {
        updateGiscusTheme();
    });

    observer.observe(document.documentElement, {
        attributes: true,
        attributeFilter: ["data-theme"]
    });

    window.matchMedia("(prefers-color-scheme: dark)")
        .addEventListener("change", updateGiscusTheme);

    const iframeObserver = new MutationObserver(() => {
        const iframe = document.querySelector(".giscus-frame");

        if (iframe && !iframe.dataset.themeListener) {
            iframe.dataset.themeListener = "true";
            iframe.addEventListener("load", updateGiscusTheme);
        }
    });

    iframeObserver.observe(document.body, {
        childList: true,
        subtree: true
    });

    document.currentScript.after(giscusScript);
})();
</script>
